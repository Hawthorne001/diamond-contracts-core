name: Static analysis

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [core, dao, views]

    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Solidity compilers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-compilers-${{ runner.os }}-${{ hashFiles('hardhat.base.ts') }}
          restore-keys: hardhat-compilers-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Solhint
        id: solhint
        continue-on-error: true
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm --dir "$PACKAGE" run solhint:ci

      - name: Generate Solhint report
        if: always()
        continue-on-error: true
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm --dir "$PACKAGE" run solhint:sarif-report

      - name: Upload Solhint report
        if: >
          always() &&
          hashFiles(format('{0}/solhint_report.sarif', matrix.package)) != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: ${{ matrix.package }}/solhint_report.sarif
          category: solhint-${{ matrix.package }}

      - name: Build contracts for Slither
        env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm --dir "$PACKAGE" run build

      - name: Run Slither
        id: slither
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: ${{ matrix.package }}
          slither-config: ${{ matrix.package }}/slither.config.json
          slither-version: 0.11.6
          ignore-compile: true
          slither-args: --compile-force-framework hardhat
          sarif: ${{ matrix.package }}/slither_report.sarif
          fail-on: none

      - name: Upload Slither report
        if: >
          always() &&
          hashFiles(format('{0}/slither_report.sarif', matrix.package)) != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: ${{ matrix.package }}/slither_report.sarif
          category: slither-${{ matrix.package }}

      - name: Fail on Solhint findings
        if: always()
        env:
          SOLHINT_OUTCOME: ${{ steps.solhint.outcome }}
        run: test "$SOLHINT_OUTCOME" = "success"

  dependencies:
    name: dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan dependencies with Grype
        id: grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          path: "."
          config: .grype.yaml
          fail-build: true
          severity-cutoff: high
        env:
          SYFT_SOURCE_NAME: dmd-contracts-monorepo
          SYFT_SOURCE_VERSION: ${{ github.sha }}

      - name: Upload Grype report
        if: >
          always() &&
          steps.grype.outputs.sarif != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  static-analysis-required:
    name: static-analysis-required
    if: always()
    needs: [analyze, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          ANALYZE: ${{ needs.analyze.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
        run: |
          echo "analyze=$ANALYZE dependencies=$DEPENDENCIES"
          test "$ANALYZE" = "success"
          test "$DEPENDENCIES" = "success"
