name: Package CI

on:
  workflow_call:
    inputs:
      package:
        description: Workspace package directory to build, lint and test.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Solidity compilers
        uses: actions/cache@v4
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-compilers-${{ runner.os }}-${{ hashFiles('hardhat.base.ts') }}
          restore-keys: hardhat-compilers-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --dir "$PACKAGE" run lint

      - name: Build
        run: pnpm --dir "$PACKAGE" run build

      - name: Test with coverage
        run: pnpm --dir "$PACKAGE" run coverage

      - name: Upload coverage to Coveralls
        if: hashFiles(format('{0}/coverage/lcov.info', inputs.package)) != ''
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ inputs.package }}/coverage/lcov.info
          base-path: ${{ inputs.package }}
          flag-name: ${{ inputs.package }}
          parallel: true
